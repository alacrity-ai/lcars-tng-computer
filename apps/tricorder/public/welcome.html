<html lang="en">

<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* The Welcome Console (TNGC-39): the landing page IS a wall. This shell is
     quiet chrome around a letterboxed iframe of the deployed /vs/ stage — the
     same build the tricorder viewscreen uses — driven by scripted display
     frames. Palette and type mirror @tng/panel-renderer/lcars.css exactly. */
  :root {
    --gold: #ff9900; --peach: #ffcc99; --lav: #cc99cc; --blue: #9999cc;
    --red: #cc6666; --cream: #ffcc66; --ink: #000;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body {
    font-family: Antonio, "Arial Narrow", "Avenir Next Condensed", sans-serif;
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: .06em;
    -webkit-font-smoothing: antialiased;
    display: grid;
    grid-template-rows: auto 1fr auto;
    /* minmax(0,1fr): the header's no-wrap min-content must never widen the
       column past the viewport, or the footer banks stop wrapping. */
    grid-template-columns: minmax(0, 1fr);
    height: 100dvh;
  }
  button { font: inherit; letter-spacing: inherit; text-transform: inherit; border: 0; cursor: pointer; }
  a { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* ---- header band ------------------------------------------------------ */
  header {
    display: flex; align-items: stretch; gap: 4px;
    padding: 10px 12px 6px; height: 58px;
  }
  header .cap-l { width: 42px; background: var(--gold); border-radius: 21px 0 0 21px; flex: none; }
  header .wordmark {
    flex: none; display: flex; align-items: center; padding: 0 14px;
    background: var(--gold); color: var(--ink);
    font-weight: 700; font-size: 19px; white-space: nowrap;
  }
  header .bar {
    flex: 1; background: var(--lav); min-width: 20px;
    display: flex; align-items: center; justify-content: flex-end; padding: 0 12px;
    color: var(--ink); font-weight: 700; font-size: 12px; white-space: nowrap;
    overflow: hidden;
  }
  header a.pill {
    flex: none; display: flex; align-items: center; padding: 0 18px;
    text-decoration: none; color: var(--ink); font-weight: 700; font-size: 14px;
    background: var(--blue); white-space: nowrap;
    transition: filter .12s;
  }
  header a.pill:hover { filter: brightness(1.18); }
  header a.pill.gold { background: var(--gold); }
  header .cap-r { width: 20px; background: var(--peach); border-radius: 0 21px 21px 0; flex: none; }

  /* ---- the wall --------------------------------------------------------- */
  #stagebox { position: relative; overflow: hidden; }
  #stage {
    position: absolute; left: 50%; top: 50%;
    width: 1280px; height: 720px; border: 0; background: #000;
    transform: translate(-50%, -50%) scale(.2);
    transform-origin: center center;
  }

  /* ---- command footer ---------------------------------------------------- */
  footer { padding: 6px 12px 12px; display: grid; gap: 6px; }
  .bank { display: flex; flex-wrap: wrap; gap: 3px; align-items: stretch; }
  .key {
    background: var(--gold); color: var(--ink);
    font-weight: 700; font-size: 13px; white-space: nowrap;
    padding: 11px 16px 9px; min-width: 96px; text-align: right;
    transition: filter .12s;
  }
  .key:hover { filter: brightness(1.18); }
  .key:active { filter: brightness(1.3); }
  .bank .key:first-child { border-radius: 17px 0 0 17px; }
  .bank .key:last-child { border-radius: 0 17px 17px 0; }
  .key[aria-pressed="true"] { background: var(--peach); }
  .key.ctx { background: var(--blue); text-align: left; min-width: 0; }
  .key.ctx.gold { background: var(--gold); }
  .key.ctx.red { background: var(--red); }
  .key[disabled] { background: #3a3a3a; color: #777; cursor: default; }
  .key[disabled]:hover { filter: none; }
  #ctx-label {
    flex: none; align-self: stretch; display: flex; align-items: center;
    padding: 0 12px 0 4px; color: var(--blue); font-size: 11px; letter-spacing: .14em;
  }
  a.key { text-decoration: none; display: inline-flex; align-items: center; }

  /* copy toast — same pattern the old page used */
  #toast {
    position: fixed; left: 50%; bottom: 84px; transform: translate(-50%, 16px);
    background: var(--gold); color: var(--ink); font-weight: 700;
    font-size: 13px; padding: 10px 24px; border-radius: 18px; opacity: 0;
    pointer-events: none; transition: opacity .2s, transform .2s; z-index: 10;
  }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }

  noscript {
    grid-row: 2; display: block; padding: 40px 24px; color: var(--peach);
    text-transform: none; letter-spacing: .03em; max-width: 720px; margin: 0 auto;
    font-size: 16px; line-height: 1.6;
  }
  noscript a { color: var(--blue); }

  @media (max-width: 720px) {
    header { height: 50px; padding: 8px 8px 4px; gap: 3px; }
    header .cap-l { width: 18px; border-radius: 16px 0 0 16px; }
    header .cap-r { width: 12px; border-radius: 0 16px 16px 0; }
    header .wordmark { font-size: 13px; padding: 0 8px; }
    header .bar span { display: none; }
    header a.pill { font-size: 11px; padding: 0 9px; }
    footer { padding: 4px 8px 10px; }
    .key { font-size: 12px; padding: 10px 12px 8px; min-width: 0; flex: 1 0 auto; }
    #ctx-label { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="cap-l" aria-hidden="true"></div>
  <div class="wordmark">TNG&nbsp;Computer</div>
  <div class="bar" aria-hidden="true"><span>Free beta &middot; invited households</span></div>
  <a class="pill" href="/?login=1">Log in</a>
  <a class="pill gold" href="/?register=1">Create household</a>
  <div class="cap-r" aria-hidden="true"></div>
</header>

<div id="stagebox">
  <iframe id="stage" src="/vs/?cursor=1" title="TNG Computer wall display"></iframe>
</div>

<noscript>
  <p><b>TNG Computer</b> — the ship's computer, for your home. An LCARS wall on
  your TV, push-to-talk from your phone, and a Claude brain running on your own
  hardware, on your own subscription. This site is only the relay. Setup takes
  about 15 minutes: <a href="/?register=1">create your household</a>,
  <a href="/?login=1">log in</a>, or read the
  <a href="https://github.com/alacrity-ai/lcars-tng-computer/blob/main/docs/APPLIANCE.md">install guide</a>
  (<a href="https://github.com/alacrity-ai/lcars-tng-computer">source on GitHub</a>).
  This page is an interactive console and needs JavaScript.</p>
</noscript>

<footer>
  <div class="bank" id="nav-bank" aria-label="Sections"></div>
  <div class="bank" id="ctx-bank"><span id="ctx-label">Actions</span></div>
</footer>

<div id="toast" role="status">Copied to clipboard</div>

<script>
"use strict";
/* The session script: every section is a list of wire-true display frames
   posted into the /vs/ stage exactly the way the tricorder PWA does. */

const stage = document.getElementById("stage");
const stagebox = document.getElementById("stagebox");
const navBank = document.getElementById("nav-bank");
const ctxBank = document.getElementById("ctx-bank");
const ctxLabel = document.getElementById("ctx-label");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---- letterbox the wall (the TNGC-37 pattern: the iframe element IS a
   1280×720 wall viewport, scaled to fit) ---------------------------------- */
function layoutStage() {
  const r = stagebox.getBoundingClientRect();
  if (r.width < 2 || r.height < 2) return;
  const s = Math.min(r.width / 1280, r.height / 720);
  stage.style.transform = `translate(-50%, -50%) scale(${s})`;
}
new ResizeObserver(layoutStage).observe(stagebox);
layoutStage();

/* ---- frame plumbing ------------------------------------------------------ */
let stageReady = false;
const preReady = [];
let seq = 0;
function post(msg) {
  if (!stageReady) { preReady.push(msg); return; }
  stage.contentWindow.postMessage({ type: "tng-frame", msg }, location.origin);
}
function display(view, props) {
  post({ type: "display", view, props, seq: ++seq });
}
let pulseTimer = null;
/** The processing beat a live wall shows while Claude thinks — then the
    answer lands (display clears the working badge, per the wall's own rule). */
function answer(view, props) {
  if (pulseTimer) clearTimeout(pulseTimer);
  post({ type: "working", active: true });
  pulseTimer = setTimeout(() => { pulseTimer = null; display(view, props); }, 420);
}

window.addEventListener("message", (e) => {
  if (e.origin !== location.origin || e.source !== stage.contentWindow) return;
  if (e.data && e.data.type === "tng-vs-ready" && !stageReady) {
    stageReady = true;
    clearInterval(helloTimer);
    for (const m of preReady) post(m);
    preReady.length = 0;
    // Let the wall's real boot panel breathe, then greet.
    setTimeout(() => go("greeting"), reduceMotion ? 400 : 1700);
  }
});
/* The stage's one-shot ready can beat this listener (the head stylesheet
   delays inline scripts), so ping until it answers — the stage re-posts
   ready on every hello. */
const helloTimer = setInterval(() => {
  if (stage.contentWindow) {
    stage.contentWindow.postMessage({ type: "tng-vs-hello" }, location.origin);
  }
}, 300);

/* ---- content ------------------------------------------------------------- */
const GITHUB = "https://github.com/alacrity-ai/lcars-tng-computer";
const GUIDE = GITHUB + "/blob/main/docs/APPLIANCE.md";

const GREETING = ["composite", {
  title: "TNG Computer — the ship's computer, for your home",
  accent: "gold",
  columns: 2,
  blocks: [
    { type: "group", title: "What this is", accent: "gold", items: [
      { type: "text", body: "Hold a button on your phone and talk. A calm voice answers from the wall — an LCARS display on your TV that shows charts, diagrams, recipes, maps, the night sky, whatever the conversation needs." },
      { type: "text", body: "The brain is Claude, running on your own hardware under your own subscription. This site is only the relay that connects your phones to your house — and the tricorder they carry." },
      { type: "text", role: "caption", body: "Everything on this page is rendered by the Computer's own wall software. This is not a mockup." },
    ]},
    { type: "group", title: "System status", accent: "blue", items: [
      { type: "status", label: "The wall", state: "on", detail: "any TV with a browser" },
      { type: "status", label: "The tricorder", state: "on", detail: "push-to-talk on your phone" },
      { type: "status", label: "The brain", state: "on", detail: "Claude, fenced in Docker" },
      { type: "status", label: "This relay", state: "idle", detail: "outbound-only · keeps nothing" },
      { type: "divider" },
      { type: "keyvalue", pairs: [
        { k: "Setup time", v: "About 15 minutes" },
        { k: "Panel types", v: "24 and counting" },
        { k: "Subscription", v: "Yours — Claude Pro or Max" },
        { k: "Beta", v: "Free for invited households" },
      ]},
    ]},
  ],
}];

const PARTS = ["composite", {
  title: "Three parts, one Computer",
  accent: "peach",
  columns: 3,
  blocks: [
    { type: "group", title: "The wall", accent: "gold", items: [
      { type: "text", body: "Any TV or monitor with a browser becomes an LCARS terminal. It speaks, chimes, and renders panels." },
      { type: "status", label: "Music", state: "on", detail: "keeps playing under questions" },
      { type: "status", label: "Walls", state: "on", detail: "run as many as you like" },
    ]},
    { type: "group", title: "The tricorder", accent: "lav", items: [
      { type: "text", body: "This site, installed to your phone's home screen. Push-to-talk from any room — or away from home." },
      { type: "status", label: "Library", state: "on", detail: "save panels, send to family" },
      { type: "status", label: "Viewscreen", state: "on", detail: "the wall, in your pocket" },
    ]},
    { type: "group", title: "The brain", accent: "blue", items: [
      { type: "text", body: "Claude Code, on your computer, on your subscription. Fenced in Docker with default-deny networking." },
      { type: "status", label: "Your data", state: "idle", detail: "never hosted — we only relay" },
      { type: "status", label: "Plugins", state: "idle", detail: "lighting and more, opt-in" },
    ]},
  ],
}];

const FLOW_SVG = `<svg viewBox="0 0 1000 430" xmlns="http://www.w3.org/2000/svg" font-family="Antonio, 'Arial Narrow', sans-serif">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ff9900"/></marker></defs>
  <g text-anchor="middle">
    <rect x="15" y="120" width="205" height="110" rx="26" fill="#ff9900"/>
    <text x="117" y="168" font-size="30" font-weight="700" fill="#000">YOUR PHONE</text>
    <text x="117" y="200" font-size="16" fill="#000">HOLD TO TALK</text>
    <rect x="270" y="120" width="205" height="110" rx="26" fill="#cc99cc"/>
    <text x="372" y="168" font-size="30" font-weight="700" fill="#000">THIS RELAY</text>
    <text x="372" y="200" font-size="16" fill="#000">HOLDS A COMMAND &#8804; 60 S</text>
    <rect x="525" y="120" width="205" height="110" rx="26" fill="#9999cc"/>
    <text x="627" y="168" font-size="30" font-weight="700" fill="#000">YOUR HOUSE</text>
    <text x="627" y="200" font-size="16" fill="#000">THE FENCED BRAIN</text>
    <rect x="780" y="120" width="205" height="110" rx="26" fill="#ffcc99"/>
    <text x="882" y="168" font-size="30" font-weight="700" fill="#000">THE WALL</text>
    <text x="882" y="200" font-size="16" fill="#000">VOICE + PANELS</text>
    <line x1="222" y1="175" x2="264" y2="175" stroke="#ff9900" stroke-width="5" marker-end="url(#ah)"/>
    <line x1="477" y1="175" x2="519" y2="175" stroke="#ff9900" stroke-width="5" marker-end="url(#ah)"/>
    <line x1="732" y1="175" x2="774" y2="175" stroke="#ff9900" stroke-width="5" marker-end="url(#ah)"/>
    <path d="M 627 235 C 627 300, 372 300, 372 240" fill="none" stroke="#9999cc" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#ah)"/>
    <text x="500" y="330" font-size="20" fill="#9999cc">YOUR HOUSE DIALS OUT — WITH A TOKEN ONLY YOUR HOUSEHOLD CAN MINT</text>
    <text x="500" y="365" font-size="20" fill="#9999cc">NO PORTS OPENED &#183; NOTHING CONNECTS IN</text>
    <text x="500" y="410" font-size="20" fill="#ffcc99">COMMANDS ARE DISCARDED ON RECEIPT (OR AFTER 60 S UNREAD) &#183; NO TRANSCRIPT HISTORY KEPT</text>
  </g>
</svg>`;

const CONNECTS = ["diagram", {
  title: "How it connects",
  svg: FLOW_SVG,
  caption: "Only things you deliberately save live on the relay. Everything else passes through and is gone.",
}];

/* SEE IT WORK — a reel of real panels doing real product things. */
const tzLng = Math.max(-180, Math.min(180, -(new Date().getTimezoneOffset() / 60) * 15));
const REEL = [
  ["chart", {
    title: "Household energy — this week",
    kind: "bar",
    series: [{ points: [
      { label: "Mon", value: 11.2 }, { label: "Tue", value: 12.8 },
      { label: "Wed", value: 9.6 }, { label: "Thu", value: 14.1 },
      { label: "Fri", value: 12.3 }, { label: "Sat", value: 17.9 },
      { label: "Sun", value: 15.4 },
    ]}],
    unit: "kWh",
    source: "Sample data — yours arrives via plugins",
  }],
  ["weather", {
    location: "Your street",
    days: [
      { name: "Today", high: 74, low: 58, conditions: "Clear skies", precip: 5 },
      { name: "Tomorrow", high: 77, low: 60, conditions: "Sun, light breeze", precip: 10 },
      { name: "Saturday", high: 71, low: 59, conditions: "Afternoon showers", precip: 60 },
      { name: "Sunday", high: 68, low: 55, conditions: "Clearing late", precip: 30 },
      { name: "Monday", high: 72, low: 56, conditions: "Bright and dry", precip: 5 },
    ],
  }],
  ["night-sky", {
    lat: 40, lng: tzLng,
    title: "Tonight's sky — computed live, right now",
  }],
  ["timeline", {
    title: "An evening with the Computer",
    events: [
      { when: "18:02", title: "“What's for dinner?”", detail: "Recipe steps up on the wall" },
      { when: "18:40", title: "“Play some jazz”", detail: "Music holds under later questions" },
      { when: "19:15", title: "Homework patrol", detail: "Worked math, line by line" },
      { when: "21:00", title: "“Lights to movie mode”", detail: "Scenes via the lighting plugin" },
      { when: "22:30", title: "“What's in the sky?”", detail: "A live star chart for your yard" },
    ],
    caption: "Every panel here is the real component customers see at home.",
  }],
  ["math", {
    title: "Homework help, rendered properly",
    lines: [
      { latex: "3x + 7 = 22" },
      { latex: "3x = 15", note: "subtract 7 from both sides" },
      { latex: "x = 5", note: "divide by 3" },
    ],
    caption: "Real mathematics on the wall — not chat text.",
  }],
];

const NEEDS = ["table", {
  title: "What you need",
  columns: ["Requirement", "What for", "Notes"],
  rows: [
    ["Docker", "Runs the appliance", "Docker Desktop, or docker + compose"],
    ["A box that stays on", "Hosts wall + brain", "4 cores · 4 GB RAM · x86 or ARM · no GPU"],
    ["Claude Pro or Max", "The brain", "Runs on YOUR account — we never see it"],
    ["A TV on the LAN", "The wall", "Any browser, fullscreen"],
  ],
  caption: "About 15 minutes end to end.",
}];

const INSTALL_STEPS = {
  title: "Bring the Computer online",
  subtitle: "About 15 minutes · one-time setup",
  steps: [
    { text: "Create your household",
      detail: "Register with an email and a household name — you become the admin. On your phone, add this site to the home screen: that's the tricorder. Press REGISTER below." },
    { text: "Start the appliance",
      detail: "On the box that stays on, fetch the compose file and env, then bring it up. Two containers rise: the wall + speech, and the fenced brain. The wall says NOT PAIRED and waits. Press COPY COMMANDS below." },
    { text: "Pair it, log the brain in",
      detail: "In the tricorder's Admin console, tap PAIR YOUR COMPUTER for a short code. Run the pair command with your code, then attach once to follow the Claude login link. Detach with Ctrl-P Ctrl-Q. Both persist." },
    { text: "Put it on the TV",
      detail: "Open http://<box-ip>:5173 in the TV's browser, press F11, tap ENGAGE. Hold the button on your phone: “Computer, what can you do?” If anything is off, COPY COMMANDS gives you the doctor." },
  ],
  caption: "Full guide: docs/APPLIANCE.md on GitHub — the FULL GUIDE key below.",
};
const INSTALL_CMDS = [
  null,
  "mkdir tng-computer && cd tng-computer\ncurl -O https://raw.githubusercontent.com/alacrity-ai/lcars-tng-computer/main/appliance/docker-compose.yml\ncurl -o .env https://raw.githubusercontent.com/alacrity-ai/lcars-tng-computer/main/appliance/.env.example\ndocker compose up -d",
  "docker compose exec computer tng pair ABCD-EFGH\ndocker compose attach computer",
  "docker compose exec computer tng doctor",
];

const PRIVACY = ["text", {
  title: "Privacy",
  body: "Your house dials OUT to this relay with a token only your household can mint. No ports opened, no inbound connections, ever.\n\nVoice commands are discarded the moment your Computer confirms receipt — or after 60 seconds unread. No transcript history is kept.\n\nNothing about your household is hosted for you. Only things you deliberately save (library items) live here, and they are yours to delete.\n\nThe brain is your Claude subscription on your hardware. Your conversations with it never touch our servers beyond the relay hop.",
}];

/* ---- sections + contextual key banks ------------------------------------- */
let installStep = 0;
let reelIndex = 0;
let reelTimer = null;
let reelPaused = reduceMotion;

const SECTIONS = {
  greeting: { label: "Greeting", show: () => answer(...GREETING),
    ctx: () => [nextKey("parts")] },
  parts: { label: "Three parts", show: () => answer(...PARTS),
    ctx: () => [nextKey("connects")] },
  connects: { label: "How it connects", show: () => answer(...CONNECTS),
    ctx: () => [linkKey("Privacy policy", "/privacy"), linkKey("Terms", "/tos"), nextKey("reel")] },
  reel: { label: "See it work", show: () => { reelIndex = 0; showReel(true); },
    ctx: () => [
      key("◀ Panel", () => stepReel(-1)),
      key("Panel ▶", () => stepReel(1)),
      key(reelPaused ? "Resume" : "Pause", toggleReel),
      nextKey("needs"),
    ]},
  needs: { label: "What you need", show: () => answer(...NEEDS),
    ctx: () => [nextKey("install")] },
  install: { label: "Install", show: () => { installStep = 0; showInstall(true); },
    ctx: () => {
      const keys = [
        key("◀ Step", () => stepInstall(-1), installStep === 0),
        key("Step ▶", () => stepInstall(1), installStep === INSTALL_STEPS.steps.length - 1),
      ];
      if (installStep === 0) keys.push(linkKey("Register", "/?register=1", "gold"));
      if (INSTALL_CMDS[installStep]) keys.push(key("Copy commands", copyStepCmds, false, "gold"));
      keys.push(linkKey("Full guide", GUIDE));
      return keys;
    }},
  privacy: { label: "Privacy", show: () => answer(...PRIVACY),
    ctx: () => [linkKey("Privacy policy", "/privacy"), linkKey("Terms", "/tos"),
                linkKey("Create household", "/?register=1", "gold")] },
};
const ORDER = ["greeting", "parts", "connects", "reel", "needs", "install", "privacy"];
let current = null;

function showReel(pulse) {
  const [view, props] = REEL[reelIndex];
  if (pulse) answer(view, props); else display(view, props);
  armReel();
}
function armReel() {
  if (reelTimer) clearTimeout(reelTimer);
  reelTimer = null;
  if (!reelPaused && current === "reel") {
    reelTimer = setTimeout(() => { reelIndex = (reelIndex + 1) % REEL.length; showReel(false); }, 8000);
  }
}
function stepReel(d) {
  reelIndex = (reelIndex + d + REEL.length) % REEL.length;
  showReel(false);
}
function toggleReel() {
  reelPaused = !reelPaused;
  armReel();
  renderCtx();
}
function showInstall(pulse) {
  const props = { ...INSTALL_STEPS, currentStep: installStep };
  if (pulse) answer("steps", props); else display("steps", props);
}
function stepInstall(d) {
  const n = installStep + d;
  if (n < 0 || n >= INSTALL_STEPS.steps.length) return;
  installStep = n;
  showInstall(false);
  renderCtx();
}
async function copyStepCmds() {
  const text = INSTALL_CMDS[installStep];
  if (!text) return;
  showToast((await copyText(text)) ? "Commands copied" : "Copy failed — see the full guide");
}

/* ---- key factories -------------------------------------------------------- */
function key(label, onPress, disabled, tone) {
  const b = document.createElement("button");
  b.className = "key ctx" + (tone ? " " + tone : "");
  b.textContent = label;
  if (disabled) b.disabled = true; else b.addEventListener("click", onPress);
  return b;
}
function linkKey(label, href, tone) {
  const a = document.createElement("a");
  a.className = "key ctx" + (tone ? " " + tone : "");
  a.textContent = label;
  a.href = href;
  if (/^https?:/.test(href)) { a.rel = "noopener"; a.target = "_blank"; }
  return a;
}
function nextKey(id) {
  return key("Next: " + SECTIONS[id].label + " ▶", () => go(id));
}

function renderCtx() {
  ctxBank.replaceChildren(ctxLabel);
  if (!current) return;
  for (const k of SECTIONS[current].ctx()) ctxBank.appendChild(k);
  ctxBank.appendChild(linkKey("GitHub", GITHUB, "red"));
}

function go(id) {
  if (reelTimer) { clearTimeout(reelTimer); reelTimer = null; }
  current = id;
  for (const b of navBank.children) b.setAttribute("aria-pressed", String(b.dataset.id === id));
  SECTIONS[id].show();
  renderCtx();
}

for (const id of ORDER) {
  const b = document.createElement("button");
  b.className = "key";
  b.dataset.id = id;
  b.setAttribute("aria-pressed", "false");
  b.textContent = SECTIONS[id].label;
  b.addEventListener("click", () => go(id));
  navBank.appendChild(b);
}
renderCtx();

/* arrow keys drive the stepper / the reel */
document.addEventListener("keydown", (e) => {
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  if (e.target instanceof Element && e.target.closest("input, textarea")) return;
  const d = e.key === "ArrowLeft" ? -1 : 1;
  if (current === "install") { stepInstall(d); e.preventDefault(); }
  else if (current === "reel") { stepReel(d); e.preventDefault(); }
});

/* ---- toast + clipboard (carried over) -------------------------------------- */
const toast = document.getElementById("toast");
let toastTimer = null;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("on");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("on"), 1800);
}
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch {}
    ta.remove();
    return ok;
  }
}
</script>
